<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00C6FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0072FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7F00FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF007F;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Icon Logo -->
  <g transform="translate(10, 0)">
    <!-- Outer Ring -->
    <circle cx="100" cy="100" r="85" fill="none" stroke="url(#grad)" stroke-width="4" opacity="0.4"/>
    <circle cx="100" cy="100" r="85" fill="none" stroke="url(#grad2)" stroke-width="6" stroke-dasharray="100 150" filter="url(#glow)"/>
    
    <!-- Central Shape: Brain + Graduation Cap Hybrid -->
    <!-- Cap top -->
    <polygon points="100,50 145,70 100,90 55,70" fill="url(#grad)" filter="url(#glow)"/>
    <!-- Cap bottom -->
    <path d="M 75,79 L 75,95 C 75,110 125,110 125,95 L 125,79" fill="none" stroke="url(#grad2)" stroke-width="5" stroke-linecap="round"/>
    <!-- Tassel -->
    <path d="M 100,70 L 135,80 L 135,110" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    
    <!-- Orbital Nodes / Network -->
    <circle cx="55" cy="70" r="6" fill="#FFFFFF" filter="url(#glow)"/>
    <circle cx="145" cy="70" r="6" fill="#FFFFFF" filter="url(#glow)"/>
    <circle cx="100" cy="50" r="6" fill="#FFFFFF" filter="url(#glow)"/>
    <circle cx="100" cy="90" r="6" fill="#FFFFFF" filter="url(#glow)"/>
    <circle cx="100" cy="130" r="8" fill="url(#grad)" filter="url(#glow)"/>
    
    <!-- Connection lines -->
    <line x1="100" y1="90" x2="100" y2="130" stroke="#FFFFFF" stroke-dasharray="3 3" stroke-width="2" opacity="0.6"/>
  </g>
  
  <!-- Logo Text -->
  <text x="220" y="115" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="900" fill="#FFFFFF" letter-spacing="2">
    vitap-<tspan fill="url(#grad)">UniOs</tspan>
  </text>
  
  <!-- Subtitle -->
  <text x="222" y="150" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#8892B0" letter-spacing="4">
    CAMPUS INTELLIGENCE ENGINE
  </text>
</svg>
